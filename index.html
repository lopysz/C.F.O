<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C.F.O - Caixa de Ferramentas Operacional</title>
<style>
/* ===== 1. Tokens ===== */
:root{--bg:#0a1424;--panel:#101f38;--panel2:#16294a;--line:#24406b;--accent:#3d8bfd;--text:#e8eef9;--muted:#8fa3c4;--warn:#f5b84a;--r:14px}
/* ===== 2. Base ===== */
*{box-sizing:border-box;margin:0}
body{display:flex;flex-direction:column;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--accent);background:var(--accent);padding:.55rem .9rem;border-radius:10px}
button.danger:hover{border-color:#e5646b;color:#ff9aa0}
button.ghost{background:transparent;border-color:var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;width:100%}
/* ===== 3. Início (gavetas) ===== */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;padding:1.6rem 1.2rem .8rem}
.top h1{font-size:1.9rem;letter-spacing:.12em}
.top p{color:var(--muted);margin-top:.2rem}
#home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1rem 1.2rem 3rem}
.drawer{width:min(56vw,180px);aspect-ratio:1;display:grid;place-items:center;text-align:center;font-size:1.05rem;font-weight:600;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1rem}
.drawer:hover{border-color:var(--accent);background:var(--panel2)}
/* ===== 4. Telas sobrepostas ===== */
.screen{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:10}
.screen>header{position:sticky;top:0;display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;background:var(--panel);border-bottom:1px solid var(--line);z-index:2}
.screen h2{font-size:1.05rem}
.x{width:2.3rem;height:2.3rem;padding:0;background:transparent;border-color:var(--line)}
.body{padding:1rem;max-width:1000px;margin:auto}
/* ===== 5. Hub de subgavetas ===== */
.hub{position:relative;width:min(94vw,calc(100dvh - 120px));max-width:900px;aspect-ratio:1;margin:0 auto;container-type:inline-size}
.core{position:absolute;left:50%;top:50%;width:30%;aspect-ratio:1;transform:translate(-50%,-50%);display:grid;place-items:center;text-align:center;font-weight:700;font-size:max(12px,3.6cqw);background:var(--panel2);border:2px solid var(--accent);border-radius:var(--r);padding:.4rem}
.orb{position:absolute;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;padding:.3rem;font-size:max(10px,3.2cqw);line-height:1.15;background:var(--panel);border:1px solid var(--accent)}
.orb:hover{background:var(--accent)}
.orb.off{border:1px dashed var(--line);color:var(--muted);cursor:default;background:transparent}
/* ===== 6. Planilhas ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.7rem;margin-bottom:1rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:.8rem}
.card small{color:var(--muted)}.card b{display:block;font-size:1.4rem;margin-top:.2rem}
.card.warn b{color:var(--warn)}
.bar{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.8rem}
.bar input[type=search]{flex:1;min-width:140px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:.6rem .7rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--panel);color:var(--muted);font-weight:600}
.act{text-align:right}.act button{padding:.25rem .5rem;margin-left:.2rem;background:transparent;border-color:var(--line)}
.empty{text-align:center;color:var(--muted);padding:1.5rem}
.log{margin-top:1rem;color:var(--muted);font-size:.85rem}.log li{margin-left:1rem}
/* ===== 7. Diálogo ===== */
dialog{margin:auto;width:min(92vw,420px);background:var(--panel);color:var(--text);border:1px solid var(--accent);border-radius:var(--r);padding:1.2rem}
dialog::backdrop{background:rgba(3,8,18,.7)}
dialog label{display:block;margin:.6rem 0;color:var(--muted);font-size:.85rem}
dialog label>*{margin-top:.25rem;color:var(--text)}
.row{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem}

/* ===== 8. Hub centralizado na tela ===== */
.body.center{display:flex;align-items:center;justify-content:center;min-height:calc(100dvh - 64px);max-width:none}

/* ===== 9. Foto de Separação ===== */
.foto{display:flex;gap:.8rem;align-items:center;padding:.6rem;margin-bottom:.6rem;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.foto:hover{border-color:var(--accent)}
.foto img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:none}
.full img,.prev{display:block;max-width:100%;max-height:70vh;margin:0 auto;border-radius:10px}
.full p{margin:.8rem 0}
.btn{display:inline-block;padding:.55rem .9rem;border-radius:10px;background:var(--accent);color:var(--text);text-decoration:none}

/* ===== 10. Gerador de Identificação ===== */
.ed label{display:block;margin:.9rem 0 .3rem;color:var(--muted);font-size:.85rem}
.ed .ck{display:flex;gap:.5rem;align-items:center;margin:0;padding:.35rem;color:var(--text)}
.ed .ck input{width:auto}.ed .ck span{color:var(--muted);font-size:.8rem}
.rowin{display:flex;gap:.4rem;margin-bottom:.4rem}.rowin button{padding:.3rem .6rem}
.photo{display:flex;gap:.8rem;align-items:center}
.photo img{width:96px;height:96px;object-fit:contain;background:#fff;border-radius:10px}
.clist{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:.3rem;margin-bottom:.6rem}
.pv{overflow:hidden}.pv .fp{transform-origin:top left}
/* Ficha A4 (modelo do PDF) */
.fp{width:794px;box-sizing:border-box;padding:48px 60px;background:#fff;color:#0f172a;font-family:Arial,Helvetica,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.fp h1{margin:0 0 16px;padding-bottom:14px;text-align:center;font-size:25px;border-bottom:2px solid #0f172a}
.fp-row{display:grid;gap:14px;margin-bottom:14px}
.fp-row.fp-top{grid-template-columns:1fr 1fr;height:292px}
.fp-row.fp-bottom{grid-template-columns:325fr 439fr;min-height:325px}
.fp-box{border:2px solid #0f172a;border-radius:10px;padding:12px;overflow:hidden;box-sizing:border-box}
.fp-box h2{margin:0 0 12px;padding-bottom:6px;border-bottom:3px solid #2563eb;font-size:15px;letter-spacing:.03em}
.fp-photo{display:flex;flex-direction:column;padding:8px}
.fp-img{flex:1;min-height:0;display:grid;place-items:center}
.fp-img img{max-width:100%;max-height:100%;object-fit:contain}
.fp-ca{margin-top:8px;padding:8px;background:#0f172a;color:#fff;text-align:center;font-weight:700;font-size:20px;letter-spacing:.06em;border-radius:6px}
.fp ol{margin:0;padding:0;list-style:none;counter-reset:n}
.fp ol li{counter-increment:n;margin:0 0 10px;font-weight:700;font-size:16px}
.fp ol li::before{content:counter(n) ". "}
.fp ul{margin:0;padding-left:18px;font-size:12.5px;line-height:1.35}.fp ul li{margin-bottom:12px}
.fp-chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fp-chips span{padding:5px 0;background:#eef3fb;border:1px solid #d5deee;border-radius:5px;text-align:center;font-weight:700;font-size:11px}
.fp-rev{width:270px;margin:0 0 0 auto;padding:6px 10px;border:1.5px solid #0f172a;border-radius:6px;text-align:center;font-weight:700;font-size:16px}
/* Impressão: só a ficha, em A4 */
#printArea{display:none}
@media print{@page{size:A4;margin:0}body>*:not(#printArea){display:none!important}#printArea{display:block}body{display:block;background:#fff}}

</style>
</head>
<body>
<header class="top"><div><h1>C.F.O</h1><p>Caixa de Ferramentas Operacional</p></div><button id="impPasta" class="ghost">Importar pasta</button></header>
<main id="home"></main>
<div id="screens"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ================= 1. NÚCLEO =================
/* ===== Núcleo: utilitários, armazenamento, telas e diálogos ===== */
const CFO = { modules: {}, screens: [] };

CFO.norm = t => String(t ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
CFO.esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Dados salvos no navegador (localStorage)
CFO.store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('cfo:' + k)) ?? d; } catch { return d; } },
  set(k, v) { localStorage.setItem('cfo:' + k, JSON.stringify(v)); }
};

// Abre uma tela cobrindo a atual (com X para voltar)
CFO.open = (title, render) => {
  const s = document.createElement('section');
  s.className = 'screen';
  s.innerHTML = `<header><button class="x" aria-label="Voltar">✕</button><h2>${CFO.esc(title)}</h2></header><div class="body"></div>`;
  s.querySelector('.x').onclick = CFO.close;
  document.getElementById('screens').append(s);
  CFO.screens.push(s);
  render(s.querySelector('.body'));
};
CFO.close = () => CFO.screens.pop()?.remove();

// Janela de formulário
CFO.dialog = (title, fields, onOk) => {
  const d = document.createElement('dialog');
  d.innerHTML = `<form method="dialog"><h3>${CFO.esc(title)}</h3>${fields}
    <div class="row"><button value="cancel" class="ghost" formnovalidate>Cancelar</button><button value="ok">Salvar</button></div></form>`;
  d.onclose = () => {
    if (d.returnValue === 'ok') onOk(Object.fromEntries(new FormData(d.querySelector('form'))));
    d.remove();
  };
  document.body.append(d);
  d.showModal();
};

// Banco para dados grandes (fotos) - IndexedDB. Lojas: 'fotos' (dados + miniatura), 'imgs' (foto completa) e 'fichas' (identificação)
CFO.db = (() => {
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open('cfo', 2);
    r.onupgradeneeded = () => ['fotos', 'imgs', 'fichas'].forEach(s => { if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s, { keyPath: 'id' }); });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const run = async (s, mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => { const t = db.transaction(s, mode), rq = fn(t.objectStore(s)); t.oncomplete = () => res(rq?.result); t.onerror = () => rej(t.error); });
  };
  return {
    put: (s, v) => run(s, 'readwrite', st => st.put(v)), all: s => run(s, 'readonly', st => st.getAll()),
    get: (s, id) => run(s, 'readonly', st => st.get(id)), del: (s, id) => run(s, 'readwrite', st => st.delete(id)),
    clear: s => run(s, 'readwrite', st => st.clear())
  };
})();

// Reduz uma imagem (fundo branco) e devolve JPEG em dataURL
CFO.shrink = (src, max, qual) => new Promise(res => {
  const i = new Image();
  i.onload = () => {
    const k = Math.min(1, max / Math.max(i.width, i.height)), c = document.createElement('canvas'), x = c.getContext('2d');
    c.width = Math.round(i.width * k); c.height = Math.round(i.height * k);
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(i, 0, 0, c.width, c.height);
    res(c.toDataURL('image/jpeg', qual));
  };
  i.src = src;
});

// Imprime um trecho de HTML (A4) - no diálogo do navegador também dá para "Salvar como PDF"
CFO.print = html => {
  let a = document.getElementById('printArea');
  if (!a) { a = document.createElement('div'); a.id = 'printArea'; document.body.append(a); }
  a.innerHTML = html;
  setTimeout(() => window.print(), 150);
};


// ================= 2. FÁBRICA DE PLANILHAS =================
/* ===== Fábrica de planilhas: tabela + dashboard + importar/exportar =====
   cfg: { key, title, hints, nameKey, dedupe, columns:[{k,label,alias,type,options}], dash(rows,movs), moves, qty } */

// Lê todas as abas de um arquivo .xlsx/.xls/.csv como matrizes de texto
CFO.readBook = async file => {
  const wb = XLSX.read(await file.arrayBuffer());
  return wb.SheetNames.map(n => ({ sheet: n, data: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: '', blankrows: false }) }));
};

CFO.sheet = cfg => {
  const K = cfg.key, first = cfg.columns.find(c => c.k === cfg.nameKey) || cfg.columns[0], norm = CFO.norm;
  const dk = r => (cfg.dedupe || cfg.columns.map(c => c.k)).map(k => norm(r[k])).join('|');

  /* --- Tratamento de valores --- */
  const clean = d => {
    cfg.columns.forEach(c => {
      let v = d[c.k];
      if (c.type === 'number') { v = String(v ?? '').replace(/[^\d,.-]/g, ''); if (v.includes(',')) v = v.replace(/\./g, '').replace(',', '.'); d[c.k] = parseFloat(v) || 0; }
      else if (c.type === 'date') { const t = String(v ?? '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if (t) d[c.k] = `${t[3].length == 2 ? '20' + t[3] : t[3]}-${t[2].padStart(2, '0')}-${t[1].padStart(2, '0')}`; }
      else if (c.options && !c.options.includes(v)) d[c.k] = c.options[0];
    });
    return d;
  };

  /* --- Leitura inteligente: acha o cabeçalho em qualquer linha e reconhece colunas por nome/apelido --- */
  const names = c => [c.label, ...(c.alias || [])].map(norm);
  const mapCols = hdr => {
    const m = {}, used = new Set(), h = hdr.map(norm);
    [true, false].forEach(exact => cfg.columns.forEach(c => {
      if (m[c.k] !== undefined) return;
      const i = h.findIndex((x, j) => x && !used.has(j) && names(c).some(n => exact ? x === n : x.includes(n)));
      if (i >= 0) { m[c.k] = i; used.add(i); }
    }));
    return m;
  };
  const findHeader = data => {
    for (let i = 0; i < Math.min(data.length, 100); i++) {
      const m = mapCols(data[i]), n = Object.keys(m).length;
      if (n >= Math.min(2, cfg.columns.length)) return { hi: i, m, n };
    }
    return { hi: -1, m: {}, n: 0 };
  };
  const score = data => findHeader(data).n;           // quantas colunas reconhecidas (usado para rotear a pasta)
  const importData = data => {                        // grava direto no armazenamento
    let { hi, m } = findHeader(data);
    if (hi < 0) { hi = 0; cfg.columns.forEach((c, i) => m[c.k] = i); }
    const rows = CFO.store.get(K, []), seen = new Set(rows.map(dk)); let add = 0, dup = 0;
    data.slice(hi + 1).forEach(line => {
      const r = { id: Date.now() + Math.random().toString(36).slice(2, 7) };
      cfg.columns.forEach(c => r[c.k] = m[c.k] === undefined ? '' : String(line[m[c.k]] ?? '').trim());
      if (!r[first.k]) return;
      clean(r);
      const k = dk(r); if (seen.has(k)) { dup++; return; }
      seen.add(k); rows.push(r); add++;
    });
    CFO.store.set(K, rows);
    return { add, dup };
  };

  /* --- Tela da planilha --- */
  const api = body => {
    let rows = CFO.store.get(K, []), movs = CFO.store.get(K + ':mov', []), q = '';
    const save = () => { CFO.store.set(K, rows); CFO.store.set(K + ':mov', movs); draw(); };
    const field = (c, v = '') => c.options
      ? `<label>${c.label}<select name="${c.k}">${c.options.map(o => `<option ${o == v ? 'selected' : ''}>${o}</option>`).join('')}</select></label>`
      : `<label>${c.label}<input name="${c.k}" type="${c.type || 'text'}" step="any" value="${CFO.esc(v)}" ${c === first ? 'required' : ''}></label>`;
    const form = (r = {}) => cfg.columns.map(c => field(c, r[c.k])).join('');

    function draw() {
      const list = rows.filter(r => JSON.stringify(Object.values(r)).toLowerCase().includes(q));
      body.innerHTML = `
        <div class="cards">${cfg.dash(rows, movs).map(d => `<div class="card ${d[2] || ''}"><small>${d[0]}</small><b>${d[1]}</b></div>`).join('')}</div>
        <div class="bar">
          <input id="q" type="search" placeholder="Buscar..." value="${CFO.esc(q)}">
          <button id="add">+ Adicionar</button>
          <button id="imp" class="ghost">Importar</button>
          <button id="exp" class="ghost">Exportar</button>
          <button id="clr" class="ghost danger">Limpar tudo</button>
          <input id="file" type="file" accept=".xlsx,.xls,.csv" hidden>
        </div>
        <div class="tw"><table><thead><tr>${cfg.columns.map(c => `<th>${c.label}</th>`).join('')}<th></th></tr></thead><tbody>
          ${list.map(r => `<tr>${cfg.columns.map(c => `<td>${CFO.esc(r[c.k])}</td>`).join('')}
            <td class="act">${cfg.moves ? `<button data-m="${r.id}" title="Entrada/Saída">⇅</button>` : ''}<button data-e="${r.id}" title="Editar">✎</button><button data-d="${r.id}" title="Excluir">🗑</button></td></tr>`).join('')
            || '<tr><td colspan="99" class="empty">Nenhum registro. Adicione um item ou importe uma planilha.</td></tr>'}
        </tbody></table></div>
        ${cfg.moves && movs.length ? `<ul class="log"><b>Últimas movimentações</b>${movs.slice(-5).reverse().map(m => `<li>${m.tipo}: ${CFO.esc(m.item)} (${m.qtd}) - ${CFO.esc(m.resp)} - ${m.data.slice(0, 10)}</li>`).join('')}</ul>` : ''}`;
      bind();
    }

    function bind() {
      const $ = s => body.querySelector(s), find = id => rows.find(r => r.id === id);
      $('#q').oninput = e => { q = e.target.value.toLowerCase(); draw(); const n = $('#q'); n.focus(); n.setSelectionRange(99, 99); };
      $('#add').onclick = () => CFO.dialog('Novo registro', form(), d => { rows.push({ id: Date.now() + Math.random().toString(36).slice(2, 5), ...clean(d) }); save(); });
      body.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { const r = find(b.dataset.e); CFO.dialog('Editar registro', form(r), d => { Object.assign(r, clean(d)); save(); }); });
      body.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { if (confirm('Excluir este registro?')) { rows = rows.filter(r => r.id !== b.dataset.d); save(); } });
      body.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
        const r = find(b.dataset.m);
        CFO.dialog('Movimentar: ' + r[first.k],
          `<label>Tipo<select name="tipo"><option>Saída</option><option>Entrada</option></select></label>
           <label>Quantidade<input name="qtd" type="number" min="1" required></label>
           <label>Responsável<input name="resp"></label>`,
          d => { const n = +d.qtd; r[cfg.qty] = (+r[cfg.qty] || 0) + (d.tipo === 'Entrada' ? n : -n);
                 movs.push({ item: r[first.k], tipo: d.tipo, qtd: n, resp: d.resp, data: new Date().toISOString() }); save(); });
      });
      $('#exp').onclick = () => {
        const ws = XLSX.utils.json_to_sheet(rows.map(r => Object.fromEntries(cfg.columns.map(c => [c.label, r[c.k]]))));
        const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, K); XLSX.writeFile(wb, K + '.xlsx');
      };
      $('#clr').onclick = () => { if (confirm('Apagar TODOS os registros e movimentações desta planilha?')) { rows = []; movs = []; save(); } };
      $('#imp').onclick = () => $('#file').click();
      $('#file').onchange = async e => {
        const f = e.target.files[0]; e.target.value = ''; if (!f) return;
        const sheets = await CFO.readBook(f), s = sheets.find(x => score(x.data) >= 2) || sheets[0];
        const { add, dup } = importData(s.data);
        rows = CFO.store.get(K, []); draw();
        alert(`${add} registro(s) importado(s)` + (dup ? `, ${dup} duplicado(s) ignorado(s)` : '') + '.');
      };
    }
    draw();
  };
  return Object.assign(api, { cfg, score, importData });
};


// ================= 3. IMPORTAR PASTA =================
/* ===== Importar pasta: distribui cada planilha para a função certa =====
   Reconhece pelo conteúdo (cabeçalhos) e, em empate, pelo nome do arquivo. Lê todas as abas. */
CFO.importFiles = async files => {
  const mods = Object.values(CFO.modules).filter(m => m.score), lines = [];
  const list = [...files].filter(f => /\.(xlsx|xls|csv)$/i.test(f.name) && !f.name.startsWith('~$'));
  for (const f of list) {
    let sheets;
    try { sheets = await CFO.readBook(f); } catch { lines.push([f.name, 'Não foi possível ler o arquivo']); continue; }
    const nf = CFO.norm(f.name);
    for (const s of sheets) {
      if (!s.data.length) continue;
      let best = null, top = 0;
      mods.forEach(m => {
        const raw = m.score(s.data); if (raw < 2) return;
        const pts = raw + ((m.cfg.hints || []).some(h => nf.includes(h)) ? .5 : 0);
        if (pts > top) { top = pts; best = m; }
      });
      const name = f.name + (sheets.length > 1 ? ` (${s.sheet})` : '');
      if (!best) { lines.push([name, 'Tipo de planilha não reconhecido']); continue; }
      const r = best.importData(s.data);
      lines.push([name, `${best.cfg.title}: ${r.add} novo(s)` + (r.dup ? `, ${r.dup} duplicado(s) ignorado(s)` : '')]);
    }
  }
  if (!lines.length) lines.push(['Nenhuma planilha (.xlsx, .xls, .csv) encontrada', '']);
  CFO.open('Resultado da importação', body => {
    body.innerHTML = `<div class="tw"><table><thead><tr><th>Arquivo</th><th>Resultado</th></tr></thead><tbody>${lines.map(l => `<tr><td>${CFO.esc(l[0])}</td><td>${CFO.esc(l[1])}</td></tr>`).join('')}</tbody></table></div>`;
  });
};


// ================= 4. MÓDULO: ALMOXARIFADO =================
/* ===== Gaveta: Almoxarifado Operacional ===== */
const dias = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const hoje = () => dias(0);

// Planilha de EPIs (modelo: CÓDIGO | ITEM / DESCRIÇÃO | QUANTIDADE EM ESTOQUE)
CFO.modules.epi = CFO.sheet({
  key: 'epi', title: 'Planilha EPI', hints: ['epi', 'inventario'], moves: true, qty: 'qtd', nameKey: 'item', dedupe: ['codigo', 'item'],
  columns: [
    { k: 'codigo', label: 'Código', alias: ['cod', 'codigo item'] },
    { k: 'item', label: 'Item / Descrição', alias: ['item', 'descricao', 'produto', 'epi'] },
    { k: 'qtd', label: 'Estoque', type: 'number', alias: ['quantidade', 'qtd', 'quantidade em estoque'] },
    { k: 'min', label: 'Estoque mínimo', type: 'number', alias: ['minimo', 'qtd minima'] }
  ],
  dash: (rows, movs) => {
    const lim = dias(-30), rec = movs.filter(m => m.data.slice(0, 10) >= lim);
    const soma = t => rec.filter(m => m.tipo === t).reduce((a, m) => a + m.qtd, 0);
    return [['Itens cadastrados', rows.length], ['Estoque baixo', rows.filter(r => r.min > 0 && r.qtd <= r.min).length, 'warn'],
            ['Entradas (30 dias)', soma('Entrada')], ['Saídas (30 dias)', soma('Saída')]];
  }
});

// Planilha de contratos (modelo: N° Contrato | CONTRATOS)
CFO.modules.contratos = CFO.sheet({
  key: 'contratos', title: 'Contratos ativos', hints: ['contrato'], nameKey: 'nome', dedupe: ['num', 'nome'],
  columns: [
    { k: 'num', label: 'N° Contrato', alias: ['numero', 'n contrato', 'nº', 'contrato n'] },
    { k: 'nome', label: 'Contrato', alias: ['contratos', 'descricao', 'nome', 'cliente'] },
    { k: 'ini', label: 'Início', type: 'date', alias: ['inicio', 'data inicio'] },
    { k: 'fim', label: 'Término', type: 'date', alias: ['termino', 'vencimento', 'data fim'] },
    { k: 'valor', label: 'Valor (R$)', type: 'number', alias: ['valor'] },
    { k: 'status', label: 'Status', options: ['Ativo', 'Suspenso', 'Encerrado'], alias: ['situacao'] }
  ],
  dash: rows => {
    const at = rows.filter(r => r.status === 'Ativo');
    return [['Contratos ativos', at.length],
            ['Vencem em 30 dias', at.filter(r => r.fim >= hoje() && r.fim <= dias(30)).length, 'warn'],
            ['Vencidos', at.filter(r => r.fim && r.fim < hoje()).length, 'warn'],
            ['Valor ativo', 'R$ ' + at.reduce((a, r) => a + r.valor, 0).toLocaleString('pt-BR')]];
  }
});


// ================= 5. MÓDULO: FERRAMENTAS - FOTO DE SEPARAÇÃO =================
/* ===== Gaveta: Ferramentas ===== */

// Foto de Separação: histórico de fotos das requisições separadas (data/hora do aparelho)
CFO.modules.fotos = body => {
  let list = [], q = '', day = '';
  const fmt = iso => new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'medium' });
  const shrink = CFO.shrink;

  body.innerHTML = `
    <div class="bar">
      <button id="shot">📷 Tirar foto</button>
      <input id="q" type="search" placeholder="Buscar requisição ou observação...">
      <input id="day" type="date" title="Filtrar por dia" style="width:auto">
      <button id="clr" class="ghost danger">Limpar tudo</button>
      <input id="cam" type="file" accept="image/*" capture="environment" hidden>
    </div>
    <p class="log" id="count"></p><div id="lst"></div>`;
  const $ = s => body.querySelector(s);

  async function load() { list = (await CFO.db.all('fotos')).sort((a, b) => b.ts.localeCompare(a.ts)); render(); }

  function render() {
    const v = list.filter(f => (!day || f.dia === day) && CFO.norm(`${f.req} ${f.obs} ${fmt(f.ts)}`).includes(CFO.norm(q)));
    $('#count').textContent = `${v.length} foto(s)` + (v.length !== list.length ? ` de ${list.length}` : '');
    $('#lst').innerHTML = v.map(f => `
      <div class="foto" data-id="${f.id}"><img src="${f.th}" alt="Foto de separação">
        <div><b>${fmt(f.ts)}</b><br>${f.req ? 'Requisição: ' + CFO.esc(f.req) : '<small>Sem nº de requisição</small>'}${f.obs ? `<br><small>${CFO.esc(f.obs)}</small>` : ''}</div></div>`).join('')
      || '<p class="empty">Nenhuma foto. Toque em "Tirar foto" para registrar uma separação.</p>';
    body.querySelectorAll('.foto').forEach(el => el.onclick = () => view(el.dataset.id));
  }

  function view(id) {
    CFO.open('Foto de separação', async b => {
      const f = list.find(x => x.id === id), full = (await CFO.db.get('imgs', id))?.img || f.th;
      b.innerHTML = `<div class="full"><img src="${full}" alt="Foto de separação">
        <p><b>${fmt(f.ts)}</b><br>${f.req ? 'Requisição: ' + CFO.esc(f.req) : ''}${f.obs ? '<br>' + CFO.esc(f.obs) : ''}</p>
        <div class="bar"><a id="dl" class="btn" download="separacao-${f.dia}-${f.ts.slice(11, 19).replace(/:/g, '')}.jpg" href="${full}">Baixar</a>
        <button id="del" class="ghost danger">Excluir</button></div></div>`;
      b.querySelector('#del').onclick = async () => {
        if (!confirm('Excluir esta foto?')) return;
        await CFO.db.del('fotos', id); await CFO.db.del('imgs', id); CFO.close(); load();
      };
    });
  }

  $('#shot').onclick = () => $('#cam').click();
  $('#cam').onchange = async e => {
    const file = e.target.files[0]; e.target.value = ''; if (!file) return;
    const url = URL.createObjectURL(file), now = new Date();
    const img = await shrink(url, 1280, .7), th = await shrink(url, 240, .7);
    URL.revokeObjectURL(url);
    CFO.dialog('Salvar foto', `<img class="prev" src="${th}" alt=""><p class="log">${fmt(now.toISOString())}</p>
      <label>Nº da requisição (opcional)<input name="req"></label><label>Observação (opcional)<input name="obs"></label>`,
      async d => {
        const id = Date.now() + Math.random().toString(36).slice(2, 6);
        await CFO.db.put('imgs', { id, img });
        await CFO.db.put('fotos', { id, ts: now.toISOString(), dia: now.toLocaleDateString('en-CA'), req: d.req.trim(), obs: d.obs.trim(), th });
        navigator.storage?.persist?.();
        load();
      });
  };
  $('#q').oninput = e => { q = e.target.value; render(); };
  $('#day').onchange = e => { day = e.target.value; render(); };
  $('#clr').onclick = async () => { if (confirm('Apagar TODAS as fotos? Não dá para desfazer.')) { await CFO.db.clear('fotos'); await CFO.db.clear('imgs'); load(); } };
  load();
};


// ================= 6. MÓDULO: FERRAMENTAS - GERADOR DE IDENTIFICAÇÃO =================
/* ===== Ferramentas: Gerador de Identificação (fichas de prateleira, A4) ===== */
(() => {
  const esc = CFO.esc, num = (a, b) => String(a).localeCompare(String(b), 'pt-BR', { numeric: true });

  // Modelo da ficha - segue o PDF de referência (só as informações mudam)
  const fichaHTML = f => `
    <div class="fp">
      <h1>FICHA DE PRODUTO</h1>
      <div class="fp-row fp-top">
        <div class="fp-box fp-photo"><div class="fp-img">${f.foto ? `<img src="${f.foto}" alt="">` : ''}</div><div class="fp-ca">C.A. ${esc(f.ca)}</div></div>
        <div class="fp-box"><h2>DENOMINAÇÕES</h2><ol>${f.den.map(d => `<li>${esc(d)}</li>`).join('')}</ol></div>
      </div>
      <div class="fp-row fp-bottom">
        <div class="fp-box"><h2>UTILIDADE</h2><ul>${f.util.map(u => `<li>${esc(u)}</li>`).join('')}</ul></div>
        <div class="fp-box"><h2>UTILIZADOS NOS CONTRATOS</h2><div class="fp-chips">${[...f.contratos].sort(num).map(c => `<span>${esc(c)}</span>`).join('')}</div></div>
      </div>
      <div class="fp-rev">Data de revisão __ /__ /__</div>
    </div>`;

  CFO.modules.etiquetas = body => {
    let list = [];
    body.innerHTML = `<div class="bar"><button id="new">+ Nova ficha</button><input id="q" type="search" placeholder="Buscar por C.A. ou nome..."></div><div id="lst"></div>`;
    const $ = s => body.querySelector(s);

    /* --- Lista --- */
    async function load() { list = (await CFO.db.all('fichas')).sort((a, b) => (a.den[0] || '').localeCompare(b.den[0] || '', 'pt-BR')); render(); }
    function render() {
      const t = CFO.norm($('#q').value), v = list.filter(f => CFO.norm(f.ca + ' ' + f.den.join(' ')).includes(t));
      $('#lst').innerHTML = v.map(f => `<div class="foto" data-id="${f.id}"><img src="${f.foto}" alt="" ${f.foto ? '' : 'hidden'}>
        <div><b>${esc(f.den[0] || 'Sem nome')}</b><br>C.A. ${esc(f.ca)}<br><small>${f.contratos.length} contrato(s)</small></div></div>`).join('')
        || '<p class="empty">Nenhuma ficha. Toque em "Nova ficha" para criar a primeira.</p>';
      body.querySelectorAll('.foto').forEach(el => el.onclick = () => preview(list.find(f => f.id === el.dataset.id)));
    }
    $('#q').oninput = render;
    $('#new').onclick = () => editor(null);

    /* --- Visualização / impressão --- */
    function preview(f) {
      CFO.open('Ficha de produto', b => {
        b.innerHTML = `<div class="bar"><button id="print">🖨 Imprimir / PDF</button><button id="edit" class="ghost">Editar</button>
          <button id="dup" class="ghost">Duplicar</button><button id="del" class="ghost danger">Excluir</button></div>
          <div class="pv">${fichaHTML(f)}</div>`;
        const pv = b.querySelector('.pv'), fp = pv.querySelector('.fp');
        new ResizeObserver(() => { const k = Math.min(1.15, pv.clientWidth / 794); fp.style.transform = `scale(${k})`; pv.style.height = fp.offsetHeight * k + 'px'; }).observe(pv);
        b.querySelector('#print').onclick = () => CFO.print(fichaHTML(f));
        b.querySelector('#edit').onclick = () => editor(f);
        b.querySelector('#dup').onclick = async () => { await CFO.db.put('fichas', { ...structuredClone(f), id: Date.now() + Math.random().toString(36).slice(2, 6) }); CFO.close(); load(); };
        b.querySelector('#del').onclick = async () => { if (confirm('Excluir esta ficha?')) { await CFO.db.del('fichas', f.id); CFO.close(); load(); } };
      });
    }

    /* --- Editor --- */
    function editor(f0) {
      CFO.open(f0 ? 'Editar ficha' : 'Nova ficha', b => {
        const f = f0 ? structuredClone(f0) : { id: Date.now() + Math.random().toString(36).slice(2, 6), foto: '', ca: '', den: [''], util: ['', '', ''], contratos: [] };
        const sel = new Set(f.contratos), q = s => b.querySelector(s);
        const base = [...new Map(CFO.store.get('contratos', []).filter(r => r.num).map(r => [String(r.num), r])).values()].sort((x, y) => num(x.num, y.num));
        b.innerHTML = `<div class="ed">
          <label>Foto do item</label>
          <div class="photo"><img id="ph" alt="" ${f.foto ? `src="${f.foto}"` : 'hidden'}><button id="pick" class="ghost">Escolher foto</button><input id="pf" type="file" accept="image/*" hidden></div>
          <label>C.A.<input id="ca" value="${esc(f.ca)}"></label>
          <label>Denominações</label><div id="den"></div><button id="addDen" class="ghost">+ Adicionar denominação</button>
          <label>Utilidades</label><div id="util"></div><button id="addUtil" class="ghost">+ Adicionar utilidade</button>
          <label>Utilizado nos contratos</label>
          <div class="bar"><input id="cq" type="search" placeholder="Buscar contrato..."><button id="all" class="ghost">Marcar todos</button><button id="none" class="ghost">Desmarcar</button></div>
          <div id="clist" class="clist"></div>
          <div class="bar"><input id="manual" placeholder="Outro nº (ex.: 1408)"><button id="addC" class="ghost">Adicionar nº</button></div>
          <p id="selc" class="log"></p>
          <div class="bar"><button id="save">Salvar ficha</button></div></div>`;

        const addRow = (box, val, area) => {
          const d = document.createElement('div'); d.className = 'rowin';
          d.innerHTML = `${area ? '<textarea rows="2"></textarea>' : '<input>'}<button class="ghost" type="button" aria-label="Remover">✕</button>`;
          d.firstChild.value = val; d.lastChild.onclick = () => d.remove(); q(box).append(d);
        };
        f.den.forEach(v => addRow('#den', v)); f.util.forEach(v => addRow('#util', v, true));
        q('#addDen').onclick = () => addRow('#den', ''); q('#addUtil').onclick = () => addRow('#util', '', true);

        q('#pick').onclick = () => q('#pf').click();
        q('#pf').onchange = async e => {
          const file = e.target.files[0]; if (!file) return;
          const u = URL.createObjectURL(file); f.foto = await CFO.shrink(u, 700, .85); URL.revokeObjectURL(u);
          q('#ph').src = f.foto; q('#ph').hidden = false;
        };

        function drawC() {
          const t = CFO.norm(q('#cq').value);
          const items = [...base.map(r => ({ n: String(r.num), t: r.nome })), ...[...sel].filter(n => !base.some(r => String(r.num) === n)).map(n => ({ n, t: '(digitado)' }))]
            .filter(i => CFO.norm(i.n + ' ' + i.t).includes(t));
          q('#clist').innerHTML = items.map(i => `<label class="ck"><input type="checkbox" value="${esc(i.n)}" ${sel.has(i.n) ? 'checked' : ''}><b>${esc(i.n)}</b><span>${esc(i.t)}</span></label>`).join('')
            || '<p class="empty">Nenhum contrato cadastrado. Importe a planilha de contratos ou adicione o número abaixo.</p>';
          q('#clist').querySelectorAll('input').forEach(c => c.onchange = () => { c.checked ? sel.add(c.value) : sel.delete(c.value); cnt(); });
          cnt();
        }
        const cnt = () => q('#selc').textContent = `${sel.size} contrato(s) selecionado(s)`;
        const shown = () => [...q('#clist').querySelectorAll('input')].map(c => c.value);
        q('#cq').oninput = drawC;
        q('#all').onclick = () => { shown().forEach(n => sel.add(n)); drawC(); };
        q('#none').onclick = () => { shown().forEach(n => sel.delete(n)); drawC(); };
        q('#addC').onclick = () => { const n = q('#manual').value.trim(); if (n) { sel.add(n); q('#manual').value = ''; drawC(); } };
        drawC();

        q('#save').onclick = async () => {
          const vals = box => [...q(box).querySelectorAll('input,textarea')].map(x => x.value.trim()).filter(Boolean);
          const ca = q('#ca').value.trim(), den = vals('#den');
          if (!ca && !den.length) { alert('Informe ao menos o C.A. ou uma denominação.'); return; }
          Object.assign(f, { ca, den, util: vals('#util'), contratos: [...sel] });
          await CFO.db.put('fichas', f);
          CFO.close(); if (f0) CFO.close(); load();
        };
      });
    }
    load();
  };
})();


// ================= 7. GAVETAS E INÍCIO =================
/* ===== Gavetas e tela inicial =====
   Para criar uma subgaveta nova: registre o módulo em js/modules/ e adicione { name, m } em subs. */
const DRAWERS = [
  { name: 'Almoxarifado Operacional', short: 'Almox. Op.',
    subs: [{ name: 'Planilha EPI', m: 'epi' }, { name: 'Contratos ativos', m: 'contratos' }] },
  { name: 'Jurídico Operacional', short: 'Jurídico Op.', subs: [] },
  { name: 'Ferramentas', short: 'Ferramentas', subs: [{ name: 'Foto de Separação', m: 'fotos' }, { name: 'Gerador de Identificação', m: 'etiquetas' }] }
];

// Quadrado central com círculos (subgavetas) ao redor
function hub(d, body) {
  const n = 6;
  body.classList.add('center');
  body.innerHTML = `<div class="hub"><div class="core">${d.short}</div>${Array.from({ length: n }, (_, i) => {
    const s = d.subs[i], a = (-90 + i * 360 / n) * Math.PI / 180;
    return `<button class="orb ${s ? '' : 'off'}" data-i="${i}" style="left:${50 + 36 * Math.cos(a)}%;top:${50 + 36 * Math.sin(a)}%">${s ? s.name : 'Em breve'}</button>`;
  }).join('')}</div>`;
  body.querySelectorAll('.orb:not(.off)').forEach(b => b.onclick = () => {
    const s = d.subs[b.dataset.i];
    CFO.open(s.name, CFO.modules[s.m]);
  });
}

// Início
const home = document.getElementById('home');
DRAWERS.forEach(d => {
  const b = document.createElement('button');
  b.className = 'drawer'; b.textContent = d.name;
  b.onclick = () => CFO.open(d.name, body => hub(d, body));
  home.append(b);
});

// Botão "Importar pasta" (topo): escolhe uma pasta e distribui as planilhas
const pick = document.createElement('input');
pick.type = 'file'; pick.multiple = true; pick.hidden = true; pick.setAttribute('webkitdirectory', '');
document.body.append(pick);
document.getElementById('impPasta').onclick = () => pick.click();
pick.onchange = async () => { const f = [...pick.files]; pick.value = ''; await CFO.importFiles(f); };

</script>
</body>
